<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>스마트미러</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 30px;
    }
    .weather {
      font-size: 1.5rem;
    }
    .temp {
      font-size: 3rem;
      font-weight: bold;
    }
    #assistant-response {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 20px 30px;
      border-radius: 10px;
      font-size: 1.2rem;
      display: none;
      animation: fadeInOut 4s forwards;
      max-width: 90%;
      white-space: pre-wrap;
    }
    button {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: 1rem;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; display: none; }
    }
    .note {
      margin-top: 20px;
      color: #aaa;
      font-size: 0.9rem;
    }
    .time {
      font-size: 2rem;
      margin-top: 10px;
    }
    .date {
      font-size: 1.2rem;
      margin-top: 5px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>오늘의 날씨</h1>
  <div class="weather" id="weather">불러오는 중...</div>
  <div class="time" id="time">시간 불러오는 중...</div>
  <div class="date" id="date">날짜 불러오는 중...</div>

  <p class="note">Assistant를 사용하려면 버튼을 누르고 "오케이 구글" 또는 "ok google"이라고 말하세요.</p>

  <button id="ask-button">어시스턴트 호출</button>
  <div id="assistant-response"></div>

  <script>
    async function fetchTime() {
      try {
        const res = await fetch('/api/time');
        const data = await res.json();
        document.getElementById('time').textContent = data.time;
        document.getElementById('date').textContent = data.date;
      } catch (err) {
        document.getElementById('time').textContent = '시간 정보를 불러올 수 없습니다.';
        document.getElementById('date').textContent = '날짜 정보를 불러올 수 없습니다.';
      }
    }
  
    // 초기 호출 + 1분마다 갱신
    fetchTime();
    setInterval(fetchTime, 60000);
    
    async function fetchWeather() {
      try {
        const res = await fetch('/api/weather');
        const data = await res.json();
        document.getElementById('weather').innerHTML = `
          <div>${data.name}</div>
          <div class="temp">${data.main.temp}°C</div>
          <div>${data.weather[0].description}</div>
        `;
      } catch (err) {
        document.getElementById('weather').textContent = '날씨 정보를 불러올 수 없습니다.';
      }
    }

    function showAssistantResponse(text) {
      const el = document.getElementById('assistant-response');
      el.textContent = text;
      el.style.display = 'block';
      el.classList.remove('fadeOut');
      void el.offsetWidth; // reflow for animation restart
      el.classList.add('fadeInOut');
    }

    async function activateAssistant() {
      showAssistantResponse('? 듣는 중...\n"오케이 구글" 또는 "ok google"이라고 말하세요');
      try {
        const res = await fetch('/api/assistant');
        const data = await res.json();
        showAssistantResponse(`${data.response}`);
      } catch (err) {
        showAssistantResponse('? 오류 발생: 어시스턴트 실패');
        console.error(err);
      }
    }

    fetchWeather();
    document.getElementById('ask-button').addEventListener('click', activateAssistant);
  </script>
</body>
</html>
